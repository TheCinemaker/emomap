<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Pulse — the emotional pulse of the world, live." />

  <!-- Open Graph / Twitter card — what Reddit, Discord, etc. render as the
       link preview. Using the existing square logo as the image for now;
       swap for a proper 1200x630 banner later if one gets designed. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://emomap.pages.dev/" />
  <meta property="og:site_name" content="Pulse" />
  <meta property="og:title" content="Pulse — the emotional pulse of the world, live" />
  <meta property="og:description" content="A live map of how the whole world feels right now — post your mood, see the planet's in real time, connect with friends." />
  <meta property="og:image" content="https://emomap.pages.dev/emomap-icon-master.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pulse — the emotional pulse of the world, live" />
  <meta name="twitter:description" content="A live map of how the whole world feels right now — post your mood, see the planet's in real time, connect with friends." />
  <meta name="twitter:image" content="https://emomap.pages.dev/emomap-icon-master.png" />
  <link rel="canonical" href="https://emomap.pages.dev/" />

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#050e23">

  <!-- iOS "Add to Home Screen" standalone mode — Safari ignores the
       manifest's display:standalone, it needs these explicitly. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">

  <title>Pulse</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
