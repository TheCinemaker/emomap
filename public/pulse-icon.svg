 </linearGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5CAFFF"/><stop offset=".48" stop-color="#FF82B5"/><stop offset="1" stop-color="#FFC94D"/>
 </linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#3e9dff" stop-opacity=".22"/><stop offset="1" stop-color="#3e9dff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="245" r="196" fill="url(#halo)"/>
