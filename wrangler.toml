name = "emomap"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# Public (anon) Supabase credentials — safe to commit, same exposure as
# shipping in the built JS bundle anyway (protected by RLS, not secrecy).
# Added here because adding this file's `pages_build_output_dir` switched
# the Pages project onto Wrangler-based config, which stopped picking up
# the dashboard's own Environment Variables for the Vite build step —
# that's what took the whole site down with "supabaseUrl is required"
# (src/supabaseClient.js reads these via import.meta.env.VITE_*).
[vars]
VITE_SUPABASE_URL = "https://sfbuabdzkpzwpffuuwva.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_cu-VRKk64wyT081lOSq6Xg_C1k6W9I2"

